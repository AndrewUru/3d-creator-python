name: Windows portable

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/windows-desktop-executable"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-desktop.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean packaging/windows.spec

      - name: Verify packaged HTTP server
        shell: pwsh
        run: |
          & ".\dist\3D-Creator\3D-Creator.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:LOCALAPPDATA\Imagen-a-3D\desktop.log" -ErrorAction SilentlyContinue
            throw "El EXE no superó el smoke test"
          }

      - name: Upload portable Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Creator-Windows-x64
          path: dist/3D-Creator/
          if-no-files-found: error
          retention-days: 14
